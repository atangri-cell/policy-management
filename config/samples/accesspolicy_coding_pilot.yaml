# Example: the coding-pilot H100 endpoint.
# Ingress DENY => the public endpoint LB is torn down and the pods reject the world.
# Egress DENY  => model pods get no internet except the allowlisted domains.
apiVersion: policy.bridge.armada.ai/v1alpha1
kind: AccessPolicy
metadata:
  name: coding-pilot
  namespace: armada-system
spec:
  endpointRef:
    tenantID: "031994d8-ee16-4606-9fc3-4e0e68899eeb"
    clusterID: "0eedef0b-1a2d-498c-a2da-1a0bd1752657"
    endpointID: "b67b8c89-64ef-4d38-b8a3-543839204e37"
    hostname: "armada-bridge-llm.spaincentral.cloudapp.azure.com"
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: coding-pilot
  ingress:
    publicEndpoints: DENY        # ALLOW to expose the endpoint
    endpointRequested: true
    enableExternalIP: false
  egress:
    defaultAction: DENY          # ALLOW to open the internet
    allowedFQDNs:
      - huggingface.co
      - "*.hf.co"
      - cdn-lfs.huggingface.co
  verification:
    enabled: true
    path: /v1/models
    timeoutSeconds: 10
    insecureTLS: true
